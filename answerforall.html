<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☁ RPG 存檔解碼器 (v1.6.1 終極版)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0f; color: #e0e0e0;
  font-family: 'Consolas','Monaco',monospace;
  padding: 15px; max-width: 900px; margin: 0 auto;
  min-height: 100vh; line-height: 1.5;
}
h1 { color: #4fc3f7; text-align: center; font-size: 1.5em;
     margin-bottom: 15px; text-shadow: 0 0 10px rgba(79,195,247,0.5); }
.panel { background: #151520; border: 1px solid #2a2a3a;
         border-radius: 8px; padding: 14px; margin-bottom: 12px; }
.panel-title { color: #4fc3f7; font-weight: bold; margin-bottom: 10px;
               font-size: 0.95em; display: flex; align-items: center; gap: 8px; }
.subtitle { color: #888; font-size: 12px; }
button {
  background: #1e88e5; color: #fff; border: none; padding: 10px 16px;
  font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer;
  margin: 4px 2px; font-family: inherit; transition: all 0.15s;
}
button:hover:not(:disabled) { background: #42a5f5; transform: translateY(-1px); }
button:disabled { background: #333; color: #666; cursor: not-allowed; }
button.gold { background: #f9a825; color: #111; }
button.gold:hover:not(:disabled) { background: #fdd835; }
button.danger { background: #c62828; }
button.danger:hover:not(:disabled) { background: #e53935; }
button.small { padding: 6px 12px; font-size: 12px; }
textarea {
  width: 100%; min-height: 120px; background: #0a0a15;
  border: 1px solid #2a2a3a; color: #80cbc4;
  padding: 10px; border-radius: 6px; font-family: inherit;
  font-size: 12px; resize: vertical; word-break: break-all;
}
textarea:focus { outline: none; border-color: #4fc3f7; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.stat-row { display: flex; justify-content: space-between;
            font-size: 13px; margin: 4px 0; color: #ccc; }
.stat-row .val { color: #4fc3f7; font-weight: bold; }
.info-box { background: #0a1520; border-left: 3px solid #4fc3f7;
            padding: 8px 12px; margin: 8px 0; font-size: 12px; border-radius: 4px; }
.info-box.warn { border-left-color: #ff9800; background: #201508; }
.info-box.error { border-left-color: #f44336; background: #200a08; }
.info-box.success { border-left-color: #4caf50; background: #0a2008; }
.editor {
  background: #0a0a15; border: 1px solid #2a2a3a; border-radius: 6px;
  padding: 12px; font-size: 13px; max-height: 500px; overflow-y: auto;
}
.editor-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid #1a1a25;
}
.editor-row:last-child { border-bottom: none; }
.editor-row label { flex: 0 0 140px; color: #888; font-size: 12px; }
.editor-row input, .editor-row select {
  flex: 1; background: #151520; border: 1px solid #2a2a3a;
  color: #4fc3f7; padding: 6px 10px; border-radius: 4px;
  font-family: inherit; font-size: 13px;
}
.editor-row input:focus, .editor-row select:focus {
  outline: none; border-color: #4fc3f7;
}
.section-header {
  background: #1a1a25; padding: 8px 10px; margin: 8px 0 4px 0;
  border-radius: 4px; color: #ffd54f; font-weight: bold;
  font-size: 13px; cursor: pointer; user-select: none;
}
.section-header:hover { background: #22223a; }
pre {
  background: #0a0a15; border: 1px solid #2a2a3a;
  padding: 12px; border-radius: 6px; overflow-x: auto;
  font-size: 12px; max-height: 400px; overflow-y: auto;
  color: #80cbc4;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tab {
  padding: 8px 14px; background: #1a1a25; border: 1px solid #2a2a3a;
  border-radius: 6px; cursor: pointer; font-size: 13px; color: #888;
  transition: all 0.15s;
}
.tab.active { background: #1e88e5; color: #fff; border-color: #1e88e5; }
</style>
</head>
<body>

<h1>☁ RPG 存檔解碼器 v1.6.1</h1>

<div class="panel">
  <div class="panel-title">📥 貼上分享碼</div>
  <div class="subtitle">支援 RPG1:（舊版）與 RPG2:（新版）格式</div>
  <textarea id="inputCode" placeholder="貼上分享碼..."></textarea>
  <div class="actions">
    <button class="gold" onclick="decodeSave()">🔓 解碼</button>
    <button onclick="pasteFromClipboard()">📋 從剪貼簿貼上</button>
    <button class="danger" onclick="clearAll()">🗑️ 清空</button>
  </div>
</div>

<div id="messageBox"></div>

<div id="resultArea" style="display:none;">
  <div class="panel">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('editor', this)">✏️ 編輯模式</div>
      <div class="tab" onclick="switchTab('raw', this)">📄 原始 JSON</div>
      <div class="tab" onclick="switchTab('stats', this)">📊 統計</div>
    </div>

    <!-- ── 編輯模式 ── -->
    <div id="tab-editor">
      <div class="subtitle" style="margin-bottom:10px;">⚠️ 修改後記得按「重新編碼」才會生效</div>
      <div id="editorContent" class="editor"></div>
      <div class="actions">
        <button class="gold" onclick="encodeSave()">🔒 重新編碼</button>
        <button onclick="resetEdits()">↺ 還原</button>
      </div>
    </div>

    <!-- ── 原始 JSON ── -->
    <div id="tab-raw" style="display:none;">
      <div class="subtitle" style="margin-bottom:10px;">完整 JSON 內容（可讀格式）</div>
      <pre id="rawJson"></pre>
      <div class="actions">
        <button onclick="copyRawJson()">📋 複製 JSON</button>
      </div>
    </div>

    <!-- ── 統計 ── -->
    <div id="tab-stats" style="display:none;">
      <div id="statsContent"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">📤 新的分享碼</div>
    <div class="subtitle">複製這段貼回遊戲的「雲端存檔 → 匯入」</div>
    <textarea id="outputCode" readonly></textarea>
    <div class="actions">
      <button class="gold" onclick="copyOutput()">📋 複製</button>
    </div>
  </div>
</div>

// ============================================================
//  主邏輯
// ============================================================
let currentSave = null;
let currentFormat = null;
let originalJson = null;

function showMessage(msg, type = 'info') {
  document.getElementById('messageBox').innerHTML = `<div class="info-box ${type}">${msg}</div>`;
}

function clearAll() {
  document.getElementById('inputCode').value = '';
  document.getElementById('outputCode').value = '';
  document.getElementById('messageBox').innerHTML = '';
  document.getElementById('resultArea').style.display = 'none';
  currentSave = null; currentFormat = null; originalJson = null;
}

async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('inputCode').value = text;
    decodeSave();
  } catch(e) { showMessage('無法讀取剪貼簿，請手動貼上', 'warn'); }
}

function decodeSave() {
  const code = document.getElementById('inputCode').value.trim();
  if (!code) { showMessage('請先貼上分享碼', 'error'); return; }

  let json, format;
  if (code.startsWith('RPG2:') || code.startsWith('RPG1:')) {
    format = code.slice(0, 4);
    try {
      json = LZString.decompressFromBase64(code.slice(5));
    } catch(e) { showMessage('解壓失敗：' + e.message, 'error'); return; }
  } else {
    showMessage('分享碼格式錯誤（缺少 RPG1: 或 RPG2: 前綴）', 'error'); return;
  }

  if (!json) { showMessage('解壓失敗：資料為空或損壞', 'error'); return; }

  try {
    currentSave = JSON.parse(json);
    currentFormat = format;
    originalJson = json;
    showMessage(`✅ 解碼成功！格式：${format}｜原始 ${code.length} 字元｜JSON ${json.length} 字元`, 'success');
    renderEditor(); renderRaw(); renderStats();
    document.getElementById('resultArea').style.display = 'block';
  } catch(e) {
    showMessage('JSON 解析失敗：' + e.message, 'error');
  }
}

// ============================================================
//  渲染編輯器 (對應 v1.6.1 新欄位)
// ============================================================

  html += editorRow('最大 HP', 'maxHp', s.maxHp, 'number');
  html += editorRow('目前 HP', 'hp', s.hp, 'number');
  html += editorRow('攻擊力', 'atk', s.atk, 'number');
  html += editorRow('防禦力', 'def', s.def, 'number');
  html += editorRow('爆擊率 %', 'critRate', s.critRate, 'number');
  html += editorRow('爆擊傷害 %', 'critDmg', s.critDmg, 'number');
  html += editorRow('吸血 %', 'lifesteal', s.lifesteal, 'number');
  html += editorRow('閃避 %', 'playerDodge', s.playerDodge, 'number');
  html += `</div>`;

  // ── 資源 ──
  html += `<div class="section-header" onclick="toggleSection(this)">▼ 資源與進度</div><div class="section-body">`;
  html += editorRow('金幣', 'money', s.money, 'number');
  html += editorRow('藥水', 'potion', s.potion, 'number');
  html += editorRow('經驗加成 %', 'playexp', s.playexp, 'number');
  html += editorRow('章節', 'chapter', s.chapter, 'number');
  html += editorRow('擊殺數', 'killCount', s.killCount, 'number');

  html += editorRow('天賦點數', 'talentPoints', s.talentPoints, 'number');
  html += editorRow('突破等級', 'breakthroughLevel', s.breakthroughLevel, 'number');
  html += editorRow('突破點數', 'breakthroughPoints', s.breakthroughPoints, 'number');
  html += editorRow('職業等級', 'roleLevel', s.roleLevel, 'number');
  
  html += `<hr style="border-color:#2a2a3a; margin:8px 0;">`;
  html += editorRow('轉生次數', 'rebirthCount', s.rebirthCount, 'number');
  html += editorRow('轉生點數', 'rebirthPoints', s.rebirthPoints, 'number');
  html += editorRow('永久攻擊加成%', 'rebirthBonusAtk', s.rebirthBonusAtk, 'number');
  html += editorRow('永久HP加成%', 'rebirthBonusHp', s.rebirthBonusHp, 'number');
  html += editorRow('永久經驗加成%', 'rebirthBonusExp', s.rebirthBonusExp, 'number');
  html += editorRow('永久金幣加成%', 'rebirthBonusGold', s.rebirthBonusGold, 'number');
  
  html += `<hr style="border-color:#2a2a3a; margin:8px 0;">`;
  html += editorRow('仙緣點數', 'ascendPoints', s.ascendPoints, 'number');
  html += editorRow('仙體覺醒次數', 'ascendAtkBonus', s.ascendAtkBonus, 'number');
  html += editorRow('財富法則次數', 'ascendDropBonus', s.ascendDropBonus, 'number');
  html += `</div>`;

  // ── 商店強化等級 ──
  html += `<div class="section-header" onclick="toggleSection(this)">▼ 商店強化等級</div><div class="section-body">`;
  html += editorRow('武器強化', 'swordLevel', s.swordLevel, 'number');
  html += editorRow('護甲強化', 'shieldLevel', s.shieldLevel, 'number');

  // ── 快速操作 ──
  html += `<div class="section-header" onclick="toggleSection(this)">▼ 快速操作</div><div class="section-body" style="padding:10px;">`;

  html += `<button class="small gold" onclick="quickAction('points')">✨ 天賦/突破點 +100</button>`;

  html += `</div>`;

  // ── 進階：完整 JSON 編輯 ──
  html += `<div class="section-header" onclick="toggleSection(this)">▼ 進階：直接編輯 JSON（小心使用）</div>`;
  html += `<div class="section-body" style="padding:10px; display:none;">
    <div class="subtitle" style="margin-bottom:6px;">直接修改下面的 JSON，按「套用」會覆蓋所有編輯</div>
    <textarea id="jsonEditor" style="min-height:300px;">${JSON.stringify(currentSave, null, 2)}</textarea>
    <button class="small gold" onclick="applyJsonEdit()">✅ 套用 JSON</button>
  </div>`;

  c.innerHTML = html;
}

function editorRow(label, key, value, type = 'text') {
  return `<div class="editor-row">
    <label>${label}</label>
    <input type="${type}" data-key="${key}" value="${value === undefined ? '' : value}"
      oninput="updateField('${key}', this.value, '${type}')">
  </div>`;
}

function updateField(key, value, type) {
  if (!currentSave) return;
  if (type === 'number') {
    const n = parseFloat(value);
    currentSave[key] = isNaN(n) ? 0 : n;
  } else {
    currentSave[key] = value;
  }
}

function toggleSection(header) {
  const body = header.nextElementSibling;
  if (!body) return;
  if (body.style.display === 'none') {
    body.style.display = 'block';
    header.textContent = header.textContent.replace('▶', '▼');
  } else {
    body.style.display = 'none';
    header.textContent = header.textContent.replace('▼', '▶');
  }
}

function quickAction(action) {
  if (!currentSave) return;
  const s = currentSave;
  switch(action) {
    case 'maxHp': s.hp = s.maxHp; break;
    case 'money': s.money = (s.money || 0) + 100000000; break; // 加1億
    case 'points': 
      s.talentPoints = (s.talentPoints || 0) + 100; 
      s.breakthroughPoints = (s.breakthroughPoints || 0) + 100; 
      break;
    case 'rebirth':
      s.rebirthPoints = (s.rebirthPoints || 0) + 100;
      s.ascendPoints = (s.ascendPoints || 0) + 100;
      break;
    case 'level': s.level = (s.level || 1) + 100; break;
  }
  renderEditor(); renderRaw();
  showMessage(`✅ 已套用「${action}」`, 'success');
}

function applyJsonEdit() {
  try {
    const json = document.getElementById('jsonEditor').value;
    currentSave = JSON.parse(json);
    renderEditor(); renderRaw(); renderStats();
    showMessage('✅ JSON 已套用', 'success');
  } catch(e) { showMessage('JSON 格式錯誤：' + e.message, 'error'); }
}

function resetEdits() {
  if (!originalJson) return;
  currentSave = JSON.parse(originalJson);
  renderEditor(); renderRaw(); renderStats();
  showMessage('↺ 已還原到解碼時的狀態', 'info');
}

function renderRaw() {
  document.getElementById('rawJson').textContent = JSON.stringify(currentSave, null, 2);
}

function copyRawJson() {
  navigator.clipboard.writeText(JSON.stringify(currentSave, null, 2)).then(() => {
    showMessage('📋 JSON 已複製', 'success');
  }).catch(() => showMessage('複製失敗', 'error'));
}

function renderStats() {
  const s = currentSave;
  const c = document.getElementById('statsContent');

  const parts = {
    inventory: JSON.stringify(s.inventory || []).length,
    equipment: JSON.stringify(s.equipment || {}).length,
    fruits: JSON.stringify(s.fruits || {}).length,
    pets: JSON.stringify(s.pets || {}).length,
    talents: JSON.stringify(s.talents || {}).length,
    roleLevels: JSON.stringify(s.roleLevels || {}).length,
    achievements: JSON.stringify(s.achievements || {}).length,
  };
  const total = JSON.stringify(s).length;
  let other = total;
  for (const v of Object.values(parts)) other -= v;
  parts.其他 = other;
  parts.總計 = total;

  let html = `<div class="panel-title">📊 存檔各部分大小</div>`;
  html += `<div class="subtitle" style="margin-bottom:10px;">總大小：${total} 字元</div>`;

  for (const [k, v] of Object.entries(parts)) {
    const pct = total > 0 ? Math.round(v / total * 100) : 0;
    const barColor = pct > 50 ? '#f44336' : pct > 20 ? '#ff9800' : '#4caf50';
    html += `<div class="stat-row"><span>${k}</span><span class="val">${v} 字元 (${pct}%)</span></div>`;
    html += `<div style="background:#1a1a25; height:6px; border-radius:3px; overflow:hidden; margin-bottom:8px;"><div style="background:${barColor}; height:100%; width:${pct}%;"></div></div>`;
  }

  if (s.inventory) {
    const byRarity = {};
    s.inventory.forEach(it => { byRarity[it.rarity] = (byRarity[it.rarity] || 0) + 1; });
    html += `<div class="panel-title" style="margin-top:16px;">🎽 背包裝備分布</div>`;
    for (const [r, count] of Object.entries(byRarity)) {
      const names = ['', '普通', '精良', '稀有', '史詩', '傳說', '神話'];
      html += `<div class="stat-row"><span>${names[r] || r}</span><span class="val">${count} 件</span></div>`;
    }
  }
  c.innerHTML = html;
}

function encodeSave() {
  if (!currentSave) { showMessage('沒有存檔可以編碼', 'error'); return; }
  try {
    const json = JSON.stringify(currentSave);
    const compressed = LZString.compressToBase64(json);
    const prefix = currentFormat === 'RPG2' ? 'RPG2:' : 'RPG1:';
    const code = prefix + compressed;
    document.getElementById('outputCode').value = code;

    const saved = Math.round((1 - code.length / json.length) * 100);
    showMessage(`✅ 編碼成功！JSON ${json.length} → 分享碼 ${code.length} 字元（省 ${saved}%）`, 'success');
  } catch(e) { showMessage('編碼失敗：' + e.message, 'error'); }
}

function copyOutput() {
  const ta = document.getElementById('outputCode');
  if (!ta.value) { showMessage('請先按「重新編碼」', 'warn'); return; }
  ta.select();
  navigator.clipboard.writeText(ta.value).then(() => {
    showMessage('📋 分享碼已複製到剪貼簿！', 'success');
  }).catch(() => {
    try { document.execCommand('copy'); showMessage('📋 分享碼已複製！', 'success'); }
    catch(e) { showMessage('複製失敗，請手動複製', 'error'); }
  });
}

function switchTab(tabName, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');

  document.getElementById('tab-editor').style.display = tabName === 'editor' ? 'block' : 'none';
  document.getElementById('tab-raw').style.display = tabName === 'raw' ? 'block' : 'none';
  document.getElementById('tab-stats').style.display = tabName === 'stats' ? 'block' : 'none';
}

document.getElementById('inputCode').addEventListener('input', debounce(() => {
  const code = document.getElementById('inputCode').value.trim();
  if (code.length > 20 && (code.startsWith('RPG1:') || code.startsWith('RPG2:'))) {
    decodeSave();
  }
}, 500));

function debounce(fn, delay) {
  let timer;
  return function() { clearTimeout(timer); timer = setTimeout(fn, delay); };
}
</script>
</body>
</html>
